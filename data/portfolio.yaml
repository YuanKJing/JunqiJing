hero:
  name: Junqi Jing
  role: Embodied AI Researcher · B.E. Candidate
  affiliation: Harbin Institute of Technology
  current: AI Research Intern at KNOWIN AI
  current_url: https://knowinai.com/
  headline: World Model, Embodied Agent, and RSI.
  bio:
    - >-
      I’m **Junqi Jing**, a B.E. candidate in Software Engineering at
      **Harbin Institute of Technology** (2023–2027). I am an incoming Ph.D.
      student in the Department of Systems Engineering and Engineering
      Management (SEEM) at **The Chinese University of Hong Kong**, starting in
      Fall 2027 under the supervision of [**Prof. Liming
      Wang**](https://www.se.cuhk.edu.hk/people/academic-staff/prof-wang-liming/).
      My research focuses on Embodied
      AI, world models, and generative methods for physical interaction.
    - >-
      I am currently an [**AI Research Intern at KNOWIN
      AI**](https://knowinai.com/), working on VLA-based dexterous manipulation
      and World Action Models. Previously, I conducted Embodied AI research at
      **POSTECH** in the [MLV
      Lab](https://sites.google.com/view/mlvlab/home?authuser=0) with Prof.
      [Kwang In Kim](https://sites.google.com/view/kimki), and at [**Tsinghua
      University’s LEAP Lab**](https://www.leaplab.ai/) with Prof. [Gao
      Huang](https://gaohuang-net.github.io/).
    - >-
      I am seeking **research-oriented internships and collaborations** with
      leading technology companies in embodied intelligence and robotics.
  status: Open to research internship opportunities
  primary_cta:
    text: Watch robot demos
    url: /robot-demos/
  interests:
    - World Model
    - Embodied Agent
    - RSI

research:
  eyebrow: Research agenda
  title: From prediction to physical action.
  intro: >-
    My work connects world models, embodied agents, and RSI. I am interested in
    how predictive representations and learning from interaction can help
    intelligent systems understand the physical world and improve their behavior.
  areas:
    - number: "01"
      title: World Model
      text: >-
        Learning predictive representations of environment dynamics for
        reasoning, planning, and decision-making.
      tags:
        - Predictive modeling
        - Planning
    - number: "02"
      title: Embodied Agent
      text: >-
        Developing learning systems that turn interaction and feedback into
        robust, transferable robot skills.
      tags:
        - Policy learning
        - Robot control
    - number: "03"
      title: RSI
      text: >-
        Exploring how intelligent systems can use feedback and experience to
        iteratively improve their reasoning and behavior.
      tags:
        - Iterative improvement
        - Learning from feedback

robot_demos:
  eyebrow: Real-robot work
  title: Robots, not just benchmarks.
  intro: >-
    From teleoperated demonstrations to model-driven manipulation: a look at
    real-world robot interaction, data collection, and coordinated control.
  items:
    - number: "01"
      title: Real-World Teleoperation Data for Robot Foundation Models
      featured: true
      orientation: landscape
      description: >-
        A first look at real-world manipulation with robot foundation models
        and teleoperated demonstration data. This preview connects hands-on
        data collection with the goal of learning useful physical skills
        from human demonstrations.
      announcement: Stay tuned for the upcoming preview on X (Twitter), with more footage and details.
      poster: images/demos/teleop-foundation-model-demo.jpg
      video: videos/teleop-foundation-model-demo.mp4
      status: Research preview
      tags:
        - Foundation models
        - Teleoperation data
        - Real-world manipulation
    - number: "02"
      title: "Astra + pai0.5: Gesture-Guided Real-World Interaction"
      orientation: landscape
      description: >-
        Astra + pai0.5 实时结合手势与现场情况理解并执行交互任务。通过人类一次正确的演示，我们以 agent + foundation model 的方式充分发挥不同系统的优势，实时根据人类的演示和引导完成偏好的任务。
      poster: images/demos/new-demo.jpg
      video: videos/new-demo.mp4
      status: Real robot video
      tags:
        - Astra + pai0.5
        - Gesture understanding
        - Foundation model
    - number: "03"
      title: "Astra + Jev Real-World Demo: Grasping a Yellow Object"
      orientation: landscape
      description: >-
        A PiPER pick-and-place demo controlled by Astra + Jev + a robot control
        backend. RGB-only perception, with no depth input.
      poster: images/demos/piper-block-pick-and-place.jpg
      video: videos/piper-block-pick-and-place.mp4
      status: Real robot video
      tags:
        - Astra + Jev
        - RGB-only
        - No depth
    - number: "04"
      title: Dual-arm ball catching
      orientation: landscape
      description: >-
        A real-robot demonstration of coordinated dual-arm interception and
        catching of small objects in a tabletop workspace.
      poster: images/demos/dual-arm-ball-catching.jpg
      video: videos/dual-arm-ball-catching.mp4
      status: Real robot video
      tags:
        - Real robot
        - Dual-arm coordination
    - number: "05"
      title: Dual-arm teleoperation
      orientation: portrait
      description: >-
        A real-robot workspace for studying coordinated manipulation,
        demonstration collection, and human-in-the-loop control.
      poster: images/demos/teleoperation.jpg
      video: videos/teleoperation.mp4
      status: Real robot video
      tags:
        - Real robot
        - Teleoperation

publication:
  eyebrow: Selected publications
  items:
  - page: /publication/q-physjepa
    venue: ICLR 2027
    year: '2027'
    status: Under review
    title: 'Q-PhysJEPA: Query-Conditioned Physical Abstraction for JEPA World Models'
    image_alt: 'Q-PhysJEPA Figure 1: task queries reweight interaction history before compression
      to preserve task-relevant physical evidence'
    summary: Q-PhysJEPA conditions history compression on the task query, learning compact
      representations that retain physical evidence relevant to the current objective.
    contribution: Visual, proprioceptive, and action histories are organized into evidence
      slots and reweighted before compression. Latent future prediction and utility learning
      connect these abstractions to candidate selection.
    paper_url: https://openreview.net/pdf?id=CiSKLLStye
    openreview_url: https://openreview.net/forum?id=CiSKLLStye
  - venue: ICLR 2025
    title: Masked Temporal Interpolation Diffusion for Procedure Planning in Instructional
      Videos
    summary: MTID introduces latent-space temporal interpolation and task-aware masking
      to improve action-sequence planning between observed start and goal states.
    contribution: The method supplies visual mid-state supervision directly in latent space,
      encouraging temporally coherent plans without relying only on text-level supervision.
    paper_url: https://openreview.net/pdf?id=HnpDHiItd2
    project_url: https://yuankjing.github.io/MTID-Project-Page/
    openreview_url: https://openreview.net/forum?id=HnpDHiItd2
    code_url: https://github.com/WiserZhou/MTID
    page: /publication/conference-paper
    year: '2025'
    image_alt: MTID procedure planning method overview
  upcoming:
    status: Coming soon
    topic: Egocentric Object Detection
    note: A new study on object detection from egocentric visual observations is currently
      in preparation.

hobbies:
  intro: >-
    Away from the lab, I recharge through movement, travel, making,
    volunteering, and strategy games.
  items:
    - title: Keep Moving
      emoji: "🥾"
      text: >-
        I am a dedicated fan of **hiking, strength training, and badminton**.
        If you are planning a trail, a gym session, or a friendly match, I
        would love to join. 🏸
    - title: Travel and Making
      emoji: "🧳"
      text: >-
        Travel is one of my favorite ways to discover new places and
        perspectives. During my exchange semester in Korea, I **visited 12
        cities**, an experience that left me with many unforgettable memories.
        I also love making things with my hands, especially puzzles and LEGO
        builds. Recently, I have become fascinated by **3D printing** and
        have been experimenting with all kinds of playful creations. 🧩
    - title: Volunteer Work
      emoji: "💛"
      text: >-
        I have contributed **nearly 100 hours** to volunteer activities. I care
        deeply about supporting **children on the autism spectrum**, and I
        hope to keep giving my time, attention, and patience to inclusive
        communities.
    - title: Strategy and Games
      emoji: "🎮"
      text: >-
        I am a long-time **strategy-game enthusiast**, especially when it comes
        to Civilization VI, Teamfight Tactics, Command & Conquer: Red Alert,
        and StarCraft. I am also a long-time **Minecraft** player. If you are
        up for a match, a co-op session, or an ambitious build, come find me!
    - title: Photography
      emoji: "📷"
      text: >-
        Photography is another creative outlet I care deeply about. **All of
        the photography featured across this website is my own**, and I am now
        beginning to shape these images into a **personal photography
        portfolio**.

