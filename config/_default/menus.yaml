# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: About
    url: /#home
    weight: 10
  - name: Research
    url: /#research
    weight: 20
  - name: Robot Demos
    url: /#robot-demos
    weight: 30
  - name: Publication
    url: /#publication
    weight: 40
  - name: Journey
    url: /#journey
    weight: 50
  - name: News
    url: /#news
    weight: 60
