hero:
  name: Junqi Jing
  chinese_name: 荆浚淇
  role: Embodied AI Researcher · B.E. Candidate
  affiliation: Harbin Institute of Technology
  current: AI Research Intern at KNOWIN AI
  headline: World Action Models, VLA systems, and real-world robot learning.
  bio:
    - >-
      I’m **Junqi Jing (荆浚淇)**, a B.E. candidate in Software Engineering at
      Harbin Institute of Technology, expected to graduate in 2027. My research
      interests center on Embodied AI and world models, with a particular
      interest in generative approaches to learning and planning for physical
      interaction.
    - >-
      I am currently an **AI Research Intern at KNOWIN AI**, where I work on
      VLA-based dexterous-hand manipulation and exploratory research on world
      action models. Previously, I spent a semester as an exchange student at
      **POSTECH**, conducting research in the MLV Lab with Prof. Kwang In Kim,
      and later visited **Tsinghua University’s LEAP Lab** under the guidance of
      Prof. Gao Huang.
    - >-
      I am currently seeking **research-oriented internship opportunities** and
      look forward to connecting with research teams across industry,
      especially at leading technology companies working on embodied
      intelligence and robotics.
  status: Open to research internship opportunities
