# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  # mode: system  # Re-enable together with the theme chooser when dark mode returns.
  mode: light
  color: emerald

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Junqi Jing is an Embodied AI researcher working on World Model, RSL, and Video Generation.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: false
    # show_theme_chooser: true  # Temporarily disabled; uncomment to restore.
    show_theme_chooser: false
    align: center
    logo:
      text: "JUNQI JING"
    button:
      enable: true
      text: "Let's talk"
      url: "#contact"

# Site footer
footer:
  text: 'World Model · RSL · Video Generation'
  copyright:
    notice: '© {year} Junqi Jing'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false

favicon: "favicon.png"
