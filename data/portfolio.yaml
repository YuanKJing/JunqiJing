research:
  eyebrow: Research agenda
  title: From prediction to physical action.
  intro: >-
    My work connects world modeling, robot learning, and video generation. I am
    especially interested in representations that capture how environments
    evolve and support reliable physical interaction.
  areas:
    - number: "01"
      title: World Model
      text: >-
        Learning predictive representations of environment dynamics for
        reasoning, planning, and decision-making.
      tags:
        - Predictive modeling
        - Planning
    - number: "02"
      title: RSL
      text: >-
        Developing learning systems that turn interaction and feedback into
        robust, transferable robot skills.
      tags:
        - Policy learning
        - Robot control
    - number: "03"
      title: Video Generation
      text: >-
        Building controllable video models that capture temporal dynamics and
        generate coherent future visual states.
      tags:
        - Generative video
        - Temporal modeling

