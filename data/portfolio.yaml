    url: "#publication"
  interests:
    - Embodied AI
    - World Action Models
    - Vision-Language-Action
    - Dexterous Manipulation

research:
  eyebrow: Research agenda
  title: From prediction to physical action.
  intro: >-
    My work connects visual generation, temporal reasoning, and robot control.
    I am especially interested in representations that help an embodied agent
    anticipate what comes next—and choose what to do.
  areas:
    - number: "01"
      title: World Action Models
      text: >-
        Learning predictive models that connect observations, actions, and
        future physical states for planning and decision making.
      tags:
        - World models
        - Action-conditioned prediction
    - number: "02"
      title: VLA & Dexterous Manipulation
      text: >-
        Building vision-language-action systems that translate high-level
        intent into reliable behavior on real dexterous hands.
      tags:
        - VLA
        - Real-world robotics
    - number: "03"
      title: Generative Physical Intelligence
      text: >-
        Exploring intermediate representations and generative objectives that
        make physical reasoning more structured, transferable, and useful.
      tags:
        - Generative AI
        - Intermediate representations

