publication:
  eyebrow: Selected publication
  venue: ICLR 2025
  title: Masked Temporal Interpolation Diffusion for Procedure Planning in Instructional Videos
  summary: >-
    MTID introduces latent-space temporal interpolation and task-aware masking
    to improve action-sequence planning between observed start and goal states.
  contribution: >-
    The method supplies visual mid-state supervision directly in latent space,
    encouraging temporally coherent plans without relying only on text-level
    supervision.
  paper_url: https://openreview.net/pdf?id=HnpDHiItd2
  project_url: https://yuankjing.github.io/MTID-Project-Page/
  openreview_url: https://openreview.net/forum?id=HnpDHiItd2
  code_url: https://github.com/WiserZhou/MTID

