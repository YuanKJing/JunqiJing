<meta name="theme-color" content="#f5f5f2">
{{/* Keep layout CSS with its HTML so cached pages cannot lose a retired bundle. */}}
{{ $styles := resources.Get "css/portfolio.css" | minify }}
<style id="portfolio-styles">{{ replace $styles.Content "../fonts/" ("fonts/" | relURL) | safeCSS }}</style>
{{ if .IsHome }}
  <link rel="preload" href="{{ "fonts/caveat-400.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
{{ end }}
<link rel="preload" href="{{ "fonts/allura-400.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<script>
  if (
    "IntersectionObserver" in window &&
    !window.matchMedia("(prefers-reduced-motion: reduce)").matches
  ) {
    document.documentElement.classList.add("portfolio-motion");
  }
</script>
